[workspace]
resolver = "2"
members = ["crates/kronos-core", "crates/kronos-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
tch = { version = "0.24" }
hf-hub = { version = "1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
half = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1